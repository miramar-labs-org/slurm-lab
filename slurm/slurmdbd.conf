# slurmdbd: the accounting daemon. DGX only. Installed to /etc/slurm/slurmdbd.conf (owner slurm, mode 600; slurmdbd refuses anything looser).
DbdHost=localhost
DbdPort=6819
SlurmUser=slurm
AuthType=auth/munge
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/run/slurmdbd.pid

# MariaDB on the same host, over its unix socket. The DB user 'slurm' is IDENTIFIED VIA unix_socket,
# so the slurm OS user gets in with no password and there's no secret to keep in this file (see scripts/install-dbd.sh).
StorageType=accounting_storage/mysql
StorageHost=localhost
StorageUser=slurm
StorageLoc=slurm_acct_db
