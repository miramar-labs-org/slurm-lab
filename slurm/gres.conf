# Hand-declared GPUs (no NVML autodetect: the Orin's NVML is partial, see PLAN.md Phase 1).
AutoDetect=off
NodeName=spark-79b7 Name=gpu Type=gb10 File=/dev/nvidia0
# On the Orin (nvgpu driver), CUDA opens /dev/nvgpu/igpu0/ctrl (+ /dev/nvmap), not /dev/nvidia*.
# Slurm 23.11 drops file-less GPUs ("Ignoring file-less GPU"), so File= is required.
NodeName=orin Name=gpu Type=orin File=/dev/nvgpu/igpu0/ctrl
