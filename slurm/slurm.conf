# slurm-lab: 2-node cluster, DGX Spark (controller + compute) + AGX Orin (compute).
# Identical on both nodes; installed to /etc/slurm by scripts/install-node.sh.
# IPs everywhere: the DGX's /etc/hosts maps its own hostname to 127.0.0.1.
ClusterName=miramar
SlurmctldHost=spark-79b7(192.168.1.200)
SlurmUser=slurm
AuthType=auth/munge

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPort=6817
SlurmdPort=6818
SrunPortRange=60001-60100

SchedulerType=sched/backfill
# Without slurmdbd, the 23.11 main scheduler marks every job InvalidAccount: assoc_mgr_validate_assoc_id ->
# assoc_mgr_refresh_lists fails because acct_storage_g_get_qos returns NULL (still unfixed in 23.11.11).
# Only backfill (which skips that check) started jobs, so it ran every 2 s instead of 30. Not needed now that slurmdbd
# runs (jobs start in <3 s at the default 30 s). Uncomment it if you ever run without slurmdbd again.
#SchedulerParameters=bf_interval=2
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
# Memory is a consumable, so a job that asks for none gets DefMemPerCPU x its CPUs. Without this it gets the node's
# whole RealMemory, and one 1-CPU job blocks the node (sacct showed mem=16000M). Not enforced: cgroup.conf ConstrainRAMSpace=no.
DefMemPerCPU=1024
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
MpiDefault=none
ReturnToService=2
GresTypes=gpu
# Resolve job supplementary groups on each compute node, not on the controller. There's no shared
# directory service and gid numbers differ between hosts (DGX 988=docker, AGX 988=polkitd). Without this,
# orin jobs miss video/render, and CUDA fails with "NvRmMemInitNvmap failed: Permission denied".
LaunchParameters=disable_send_gids

# Accounting: slurmdbd (+ MariaDB) on the DGX, see slurm/slurmdbd.conf and scripts/install-dbd.sh.
# jobacct_gather samples per-step CPU/memory usage for sacct. linux (from /proc), because jobacct_gather/cgroup
# recorded MaxRSS=0 and CPU=0 here, even though the task cgroup's memory.current held the right value (cause not isolated).
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=task=5          # sample usage every 5 s (default 30 misses short jobs: MaxRSS 0)
AccountingStorageTRES=gres/gpu         # also record GPUs in sacct AllocTRES (cpu/mem/node are tracked by default)
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=192.168.1.200
AccountingStorageEnforce=associations  # only user/account pairs registered with sacctmgr may run jobs

# RealMemory is kept well below physical (124609 / 62878 MB). Both are unified-memory boxes
# shared with k3s/NIM/Ollama (DGX) and the Ollama judge (AGX).
NodeName=spark-79b7 NodeAddr=192.168.1.200 CPUs=20 CoresPerSocket=20 ThreadsPerCore=1 RealMemory=32000 Gres=gpu:gb10:1 State=UNKNOWN
NodeName=orin       NodeAddr=192.168.1.202 CPUs=12 CoresPerSocket=12 ThreadsPerCore=1 RealMemory=16000 Gres=gpu:orin:1 State=UNKNOWN

PartitionName=all Nodes=spark-79b7,orin Default=YES MaxTime=INFINITE State=UP
PartitionName=dgx Nodes=spark-79b7 MaxTime=INFINITE State=UP
PartitionName=agx Nodes=orin MaxTime=INFINITE State=UP
